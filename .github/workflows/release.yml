name: Build & Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 创建 Release 需要仓库写权限,GITHUB_TOKEN 默认只读

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Plugin
        run: ./gradlew buildPlugin

      # 二进制兼容关卡:对声明的 262..263.* 两端(2026.2/2026.3)跑 Plugin Verifier,
      # 实验性终端 API 跨版本移除或签名变化在此 fail fast,不带上 Release
      - name: Verify Plugin Compatibility
        run: ./gradlew verifyPlugin

      - name: Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Get Artifact Name
        id: artifact
        run: |
          ZIP_NAME=$(basename $(ls build/distributions/*.zip | head -1))
          echo "name=$ZIP_NAME" >> $GITHUB_OUTPUT

      # 从 plugin.xml 提取 CDATA description —— 单一真相源,避免与插件描述硬编码重复导致漂移
      - name: Extract Description from plugin.xml
        id: desc
        run: |
          DESCRIPTION=$(sed -n '/<description><!\[CDATA\[/,/]]><\/description>/{//!p;}' src/main/resources/META-INF/plugin.xml)
          {
            echo "body<<EOF"
            echo "$DESCRIPTION"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # 从 CHANGELOG.md 提取对应版本段作为 Release body;缺失则 fail fast,强制发版前补写 CHANGELOG
      - name: Extract Release Notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BODY=$(awk -v v="$VERSION" '/^## \[/{p=index($0,"["v"]")} p&&/^## \[/&&!index($0,"["v"]"){p=0} p' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "::error::CHANGELOG.md 未找到版本 $VERSION 的段落,请先补写 '## [$VERSION] - YYYY-MM-DD' 段"
            exit 1
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # 从 patchPluginXml 产物提取 since/until-build —— 兼容范围唯一真相源在 build.gradle.kts,
      # updatePlugins.xml 不再第二处硬编码,避免下次 IDE 大版本再漂移(本次 263 问题的同源风险)
      - name: Extract idea-version from plugin.xml
        id: ideaver
        run: |
          SINCE=$(sed -n 's/.*since-build="\([^"]*\)".*/\1/p' build/resources/main/META-INF/plugin.xml | head -1)
          UNTIL=$(sed -n 's/.*until-build="\([^"]*\)".*/\1/p' build/resources/main/META-INF/plugin.xml | head -1)
          if [ -z "$SINCE" ] || [ -z "$UNTIL" ]; then
            echo "::error::未能从 build/resources/main/META-INF/plugin.xml 提取 since/until-build"
            exit 1
          fi
          echo "since=$SINCE" >> $GITHUB_OUTPUT
          echo "until=$UNTIL" >> $GITHUB_OUTPUT

      - name: Generate updatePlugins.xml
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP_NAME: ${{ steps.artifact.outputs.name }}
          DESC: ${{ steps.desc.outputs.body }}
          SINCE: ${{ steps.ideaver.outputs.since }}
          UNTIL: ${{ steps.ideaver.outputs.until }}
        run: |
          cat > updatePlugins.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
              <plugin id="com.mypi.plugin"
                      url="https://github.com/lamcodes/MypiPlugin/releases/download/${TAG}/${ZIP_NAME}"
                      version="${VERSION}">
                  <name>MypiPlugin</name>
                  <description><![CDATA[
          ${DESC}
                  ]]></description>
                  <idea-version since-build="${SINCE}" until-build="${UNTIL}"/>
              </plugin>
          </plugins>
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/distributions/${{ steps.artifact.outputs.name }}
            updatePlugins.xml
          body: ${{ steps.notes.outputs.body }}
          fail_on_unmatched_files: true
