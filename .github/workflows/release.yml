name: Build & Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 创建 Release 需要仓库写权限,GITHUB_TOKEN 默认只读

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Get Artifact Name
        id: artifact
        run: |
          ZIP_NAME=$(basename $(ls build/distributions/*.zip | head -1))
          echo "name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Generate updatePlugins.xml
        run: |
          cat > updatePlugins.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
              <plugin id="com.mypi.plugin"
                      url="https://github.com/lamcodes/MypiPlugin/releases/download/${{ steps.version.outputs.tag }}/${{ steps.artifact.outputs.name }}"
                      version="${{ steps.version.outputs.version }}}">
                  <name>MypiPlugin</name>
                  <description><![CDATA[
                      在 IntelliJ 内置终端跑 Pi coding agent,一键把选区定位注入 Pi。
                      选中代码 → Ctrl+Alt+; → 定位串(@相对路径#L行号)填入 Pi 终端(只填不发送),焦点自动接力。
                      IDE MCP 集成(2025.2+):启动 Pi 时自动注入 IDEA MCP Server。
                  ]]></description>
                  <idea-version since-build="262" until-build="262.*"/>
              </plugin>
          </plugins>
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/distributions/${{ steps.artifact.outputs.name }}
            updatePlugins.xml
          generate_release_notes: true
          fail_on_unmatched_files: true
