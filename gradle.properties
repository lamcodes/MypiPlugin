# JVM 参数:给 Gradle daemon 足够内存,UTF-8 避免中文/编码乱码
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# 避免 Kotlin stdlib 重复打入造成插件冲突
kotlin.stdlib.default.dependency=false

# —— 插件版本与兼容范围:唯一真相源(构建、Plugin Verifier、发版索引都从这里读) ——
pluginVersion=0.2.3
# 编译目标平台:保持"最低支持版本",避免误用更新平台的 API
platformVersion=2026.2
# 兼容范围;IDEA 2026.2=262、2026.3=263,升上限时同步加 verifierIdeVersions
pluginSinceBuild=262
pluginUntilBuild=262.*
# Verifier 双端目标(逗号分隔),必须同时包含最低支持版与当前最新支持版
verifierIdeVersions=2026.2,2026.3
